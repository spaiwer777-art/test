name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          # Permanent key: app/release.keystore (created by the "Create signing key"
          # workflow) unlocked with this secret. Without it the APK uses a throwaway key.
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "certificate DN|SHA-256" | head -2
          if [ -f app/release.keystore ] && [ -n "$SIGNING_PASSWORD_SET" ]; then echo "PERMANENT_KEY=yes" >> "$GITHUB_ENV"; else echo "PERMANENT_KEY=no" >> "$GITHUB_ENV"; fi
        env:
          SIGNING_PASSWORD_SET: ${{ secrets.SIGNING_PASSWORD != '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.1.${{ github.run_number }}"
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk CalorieTracker.apk
          cp app/build/outputs/apk/release/app-release.apk "CalorieTracker-$VERSION.apk"
          {
            echo "## CalorieTracker $VERSION"
            echo
            cat RELEASE_NOTES.md
            echo
            if [ "$PERMANENT_KEY" = "yes" ]; then
              echo "🔐 Подписано постоянным ключом: обновления ставятся поверх, данные сохраняются."
            else
              echo "⚠️ Временный ключ подписи: перед установкой удали прошлую версию (сначала сохрани резервную копию)."
            fi
            echo
            echo "Коммит ${GITHUB_SHA::7}, ветка \`${GITHUB_REF_NAME}\`."
          } > notes.md
          gh release create "$TAG" CalorieTracker.apk "CalorieTracker-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "CalorieTracker $VERSION" --notes-file notes.md --latest
